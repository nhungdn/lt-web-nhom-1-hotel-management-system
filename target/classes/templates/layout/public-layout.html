<!doctype html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  th:fragment="public_layout(main_content, page_title, extra_head)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel </title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/review.png}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <th:block th:replace="${extra_head} ?: ~{}"></th:block>
    <style>
      .public-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        z-index: 100;
      }

      .public-header-nav {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .public-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #34d399;
        font-weight: 700;
        font-size: 18px;
      }

      .public-logo img {
        width: 32px;
        height: 32px;
      }

      .public-header-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .public-header .nav-link {
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--text-secondary);
        transition: all 0.3s ease;
        font-size: 14px;
      }

      .public-header .nav-link:hover {
        color: #34d399;
        background: rgba(52, 211, 153, 0.1);
      }

      .public-login-btn {
        padding: 8px 20px;
        background: linear-gradient(135deg, #34d399, #10b981);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        transition: all 0.3s ease;
        font-size: 14px;
      }

      .public-login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(52, 211, 153, 0.3);
      }

      .public-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 40px;
        min-height: calc(100vh - 80px);
      }

      @media (max-width: 768px) {
        .public-header {
          padding: 16px 20px;
        }

        .public-container {
          padding: 0 20px;
        }

        .public-header-buttons {
          gap: 8px;
        }

        .public-logo {
          font-size: 14px;
        }

        .public-header .nav-link {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Animated Background -->
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Public Header -->
    <header class="public-header">
      <a th:href="@{/}" class="public-logo">
        <img th:src="@{/images/hotel-icon.svg}" alt="Hotel Icon" />
        <span>Hotel </span>
      </a>
      <div class="public-header-buttons">
        <th:block th:if="${session.user == null}">
          <a th:href="@{/login}" class="public-login-btn">Login</a>
        </th:block>
        <th:block th:if="${session.user != null}">
          <span class="nav-link" th:text="|Welcome, ${session.user.fullName}|"></span>
          <a th:href="@{/dashboard}" class="public-login-btn">Dashboard</a>
          <a th:href="@{/logout}" class="public-login-btn" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;">Logout</a>
        </th:block>
      </div>
    </header>

    <!-- Main Content -->
    <main class="public-container" layout:fragment="main">
      <th:block th:insert="${main_content}" />
    </main>
  </body>
</html>
