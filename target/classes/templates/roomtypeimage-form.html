<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
    <head>
        <title>Room Type Image Form</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <th:block th:fragment="head">
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
        </th:block>
    </head>
    
    <body>
        <h1 th:fragment="title" th:text="${image.roomTypeImageId} != null ? 'Edit Image' : 'Add Image'">Image Form</h1>
        <div th:fragment="content">
            <section class="content-grid" style="grid-template-columns: 1fr;">
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title" th:text="${image.roomTypeImageId} != null ? 'Edit Image' : 'Add New Image'">Image Form</h2>
                            <!-- <p class="card-subtitle" th:text="${image.roomTypeImageId} != null ? 'Update image details' : 'Add a new image to the room type'">Form</p> -->
                        </div>
                    </div>

                    <form th:action="${image.roomTypeImageId} != null ? '/roomtypeimages/update/' + ${imageId} : '/roomtypeimages/create/' + ${roomTypeId}" 
                          th:object="${image}" method="post" class="form-container">
                        
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:if="${returnUrl} != null" name="returnUrl" th:value="${returnUrl}"/>
                        
                        <div class="form-section">
                            <h3 class="form-section-title">Image Information</h3>
                            
                            <div class="form-group">
                                <label for="imageUrl" class="form-label">Image URL <span style="color: #ef4444;">*</span></label>
                                <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-input glass" placeholder="https://example.com/image.jpg"/>
                                <span class="form-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></span>
                            </div>

                            <div class="form-group">
                                <label for="description" class="form-label">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-input glass" rows="4" placeholder="E.g., Room view from window, Bedroom setup"></textarea>
                                <span class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                            </div>

                            <div class="form-group" th:if="${image.imageUrl} != null and ${image.imageUrl} != ''">
                                <label class="form-label">Image Preview</label>
                                <img th:src="${image.imageUrl}" alt="Preview" style="max-width: 300px; border-radius: 8px;"/>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">Save Image</button>
                            <a th:href="${returnUrl} != null ? ${returnUrl} : '/roomtypes'" class="btn-cancel">Cancel</a>
                        </div>
                    </form>
                </div>
            </section>

            <style>
                .form-container {
                    max-width: 600px;
                }

                .form-section {
                    margin-bottom: 32px;
                    padding-bottom: 32px;
                    border-bottom: 1px solid var(--glass-border);
                }

                .form-section:last-of-type {
                    border-bottom: none;
                }

                .form-section-title {
                    font-size: 16px;
                    font-weight: 600;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                }

                .form-section-subtitle {
                    font-size: 13px;
                    color: var(--text-muted);
                    margin-bottom: 16px;
                }

                .form-group {
                    margin-bottom: 20px;
                }

                .form-label {
                    display: block;
                    font-size: 14px;
                    font-weight: 500;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                }

                .form-input {
                    width: 100%;
                    padding: 12px 16px;
                    font-family: inherit;
                    font-size: 14px;
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.05);
                    color: #fff;
                    transition: all 0.2s;
                }

                .form-input:focus {
                    outline: none;
                    background: rgba(255, 255, 255, 0.1);
                    border-color: #34d399;
                    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
                }

                textarea.form-input {
                    resize: vertical;
                }

                .form-error {
                    display: block;
                    color: #ef4444;
                    font-size: 12px;
                    margin-top: 6px;
                }

                .form-actions {
                    display: flex;
                    gap: 12px;
                    margin-top: 32px;
                }

                .btn-submit {
                    flex: 1;
                    padding: 12px 24px;
                    background: linear-gradient(135deg, #34d399, #10b981);
                    color: white;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                }

                .btn-submit:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 10px 20px rgba(52, 211, 153, 0.2);
                }

                .btn-cancel {
                    flex: 1;
                    padding: 12px 24px;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-secondary);
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    text-decoration: none;
                    text-align: center;
                    font-size: 14px;
                    font-weight: 600;
                    transition: all 0.2s;
                    cursor: pointer;
                }

                .btn-cancel:hover {
                    background: rgba(255, 255, 255, 0.1);
                    border-color: #34d399;
                }
            </style>
        </div>
    </body>
</html>
