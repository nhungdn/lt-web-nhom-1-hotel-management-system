<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Room Images</title>
</head>
<body>
<h1 layout:fragment="title">Room Images</h1>
<div layout:fragment="content">
    <h1>Room Images Management</h1>
    <a th:href="@{/roomimages/create}" class="btn btn-primary">Create Room Image</a><br><br>

    <table style="width:100%; border-collapse: collapse;" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Description</th>
                <th>Room ID</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${roomimages}">
                <td th:text="${item.roomImageId}"></td>
                <td><img th:src="${item.imageUrl}" alt="Room Image" style="max-width:120px; max-height:80px;"/></td>
                <td th:text="${item.description}"></td>
                <td th:text="${item.roomId}"></td>
                <td>
                    <a th:href="@{/roomimages/edit/{id}(id=${item.roomImageId})}" class="btn btn-warning">Edit</a>
                    <form th:action="@{/roomimages/delete/{id}(id=${item.roomImageId})}" method="post" style="display:inline; margin-left:8px;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
