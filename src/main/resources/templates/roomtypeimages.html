<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
    <head>
        <title>Room Type Images</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <th:block th:fragment="head">
            <link rel="stylesheet" th:href="@{/css/room-card.css}"/>
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
        </th:block>
    </head>
    
    <body>
        <h1 th:fragment="title">Room Type Images</h1>
        <div th:fragment="content">
            <section class="content-grid" style="grid-template-columns: 1fr;">
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title" th:text="'Images for ' + ${roomType.name}">Room Type Images</h2>
                            <p class="card-subtitle">Manage images for this room type</p>
                        </div>
                        <div class="card-actions">
                            <a th:href="@{/roomtypeimages/create/{id}(id=${roomType.roomTypeId}, returnUrl=@{/roomtypes/{rtid}/images(rtid=${roomType.roomTypeId})})}" class="card-btn">+ Add New Image</a>
                        </div>
                    </div>

                    <div class="images-grid-view">
                        <div class="image-card" th:each="img : ${roomTypeImages}">
                            <img th:src="${img.imageUrl}" alt="Room type image" class="image-preview"/>
                            <div class="image-info">
                                <p class="image-desc" th:text="${img.description != null ? img.description : 'No description'}"></p>
                            </div>
                            <div class="image-actions">
                                <a th:href="@{/roomtypeimages/edit/{id}(id=${img.roomTypeImageId}, returnUrl=@{/roomtypes/{rtid}/images(rtid=${roomType.roomTypeId})})}" class="btn-link btn-edit">Edit</a>
                                <form th:action="@{/roomtypeimages/delete/{id}(id=${img.roomTypeImageId}, returnUrl=@{/roomtypes/{rtid}/images(rtid=${roomType.roomTypeId})})}" method="post" style="display:inline;" class="delete-form">
                                    <button type="button" class="card-btn btn-danger" style="padding: 6px 12px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.5);" onclick="showConfirmDialog(this.form, 'Delete Image', 'Are you sure you want to delete this image?')">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="empty-state" th:if="${#lists.isEmpty(roomTypeImages)}">
                        <p>No images for this room type yet.</p>
                        <a th:href="@{/roomtypeimages/create/{id}(id=${roomType.roomTypeId}, returnUrl=@{/roomtypes/{rtid}/images(rtid=${roomType.roomTypeId})})}" class="card-btn">+ Add Your First Image</a>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/roomtypes/edit/{id}(id=${roomType.roomTypeId})}" class="btn-cancel">Back to Room Type Details</a>
                    </div>
                </div>
            </section>

            <style>
                .images-grid-view {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                    gap: 20px;
                    margin-bottom: 20px;
                }

                .image-card {
                    background: rgba(0, 0, 0, 0.2);
                    border: 1px solid var(--glass-border);
                    border-radius: 12px;
                    overflow: hidden;
                    transition: all 0.3s ease;
                }

                .image-card:hover {
                    transform: translateY(-4px);
                    border-color: rgba(52, 211, 153, 0.5);
                    box-shadow: 0 12px 24px rgba(52, 211, 153, 0.1);
                }

                .image-preview {
                    width: 100%;
                    height: 180px;
                    object-fit: cover;
                    display: block;
                }

                .image-info {
                    padding: 12px;
                    border-bottom: 1px solid var(--glass-border);
                }

                .image-desc {
                    font-size: 13px;
                    color: var(--text-muted);
                    margin: 0;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }

                .image-actions {
                    padding: 12px;
                    display: flex;
                    gap: 8px;
                }

                .btn-link {
                    flex: 1;
                    padding: 8px 12px;
                    text-align: center;
                    font-size: 12px;
                    text-decoration: none;
                    border-radius: 6px;
                    border: none;
                    cursor: pointer;
                    transition: all 0.2s;
                }

                .btn-edit {
                    background: rgba(52, 211, 153, 0.1);
                    color: #34d399;
                    border: 1px solid rgba(52, 211, 153, 0.3);
                }

                .btn-edit:hover {
                    background: rgba(52, 211, 153, 0.2);
                    border-color: rgba(52, 211, 153, 0.6);
                }

                .btn-delete {
                    background: rgba(239, 68, 68, 0.1);
                    color: #ef4444;
                    border: 1px solid rgba(239, 68, 68, 0.3);
                }

                .btn-delete:hover {
                    background: rgba(239, 68, 68, 0.2);
                    border-color: rgba(239, 68, 68, 0.7);
                }

                .btn-danger {
                    background: rgba(239, 68, 68, 0.1);
                    color: #ef4444;
                    border: 1px solid rgba(239, 68, 68, 0.3);
                }

                .btn-danger:hover {
                    background: rgba(239, 68, 68, 0.2);
                    border-color: rgba(239, 68, 68, 0.7);
                }

                .empty-state {
                    text-align: center;
                    padding: 60px 20px;
                    color: var(--text-muted);
                }

                .empty-state p {
                    margin-bottom: 20px;
                    font-size: 16px;
                }

.form-actions {
                    display: flex;
                    gap: 12px;
                    margin-top: 20px;
                }

                .btn-cancel {
                    flex: 1;
                    padding: 12px 24px;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-secondary);
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    text-decoration: none;
                    text-align: center;
                    font-size: 14px;
                    font-weight: 600;
                    transition: all 0.2s;
                    cursor: pointer;
                }

                .btn-cancel:hover {
                    background: rgba(255, 255, 255, 0.1);
                    border-color: var(--emerald-light);
                }

                /* Modal Styles */
                .modal-backdrop {
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.4);
                    backdrop-filter: blur(5px);
                    z-index: 9998;
                }

                .modal-backdrop.active {
                    display: block;
                }

                .modal-dialog {
                    display: none;
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%) scale(0.9);
                    z-index: 9999;
                    width: 100%;
                    max-width: 400px;
                }

                .modal-dialog.active {
                    display: block;
                    animation: slideUp 0.3s ease;
                }

                .modal-content {
                    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    border-radius: 20px;
                    padding: 28px;
                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                                inset 0 1px 0 rgba(255, 255, 255, 0.2);
                }

                .modal-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 16px;
                }

                .modal-header h3 {
                    font-size: 18px;
                    font-weight: 600;
                    color: #f5f5f4;
                    margin: 0;
                }

                .modal-close {
                    background: rgba(255, 255, 255, 0.1);
                    border: none;
                    color: #f5f5f4;
                    font-size: 24px;
                    width: 32px;
                    height: 32px;
                    border-radius: 8px;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                .modal-close:hover {
                    background: rgba(255, 255, 255, 0.2);
                    transform: rotate(90deg);
                }

                .modal-body {
                    margin-bottom: 20px;
                    font-size: 14px;
                    color: rgba(245, 245, 244, 0.8);
                    line-height: 1.5;
                }

                .modal-body p {
                    margin: 0;
                }

                .modal-footer {
                    display: flex;
                    gap: 12px;
                    justify-content: flex-end;
                }

                .btn-cancel-modal, .btn-delete-modal {
                    padding: 10px 20px;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                }

                .btn-cancel-modal {
                    background: rgba(0, 0, 0, 0.2);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    color: #f5f5f4;
                }

                .btn-cancel-modal:hover {
                    background: rgba(0, 0, 0, 0.3);
                    border-color: rgba(255, 255, 255, 0.2);
                }

                .btn-delete-modal {
                    background: linear-gradient(135deg, rgba(220, 38, 38, 0.3) 0%, rgba(239, 68, 68, 0.2) 100%);
                    border: 1px solid rgba(220, 38, 38, 0.5);
                    color: #fca5a5;
                }

                .btn-delete-modal:hover {
                    background: linear-gradient(135deg, rgba(220, 38, 38, 0.4) 0%, rgba(239, 68, 68, 0.3) 100%);
                    border-color: rgba(220, 38, 38, 0.7);
                    transform: translateY(-2px);
                }

                @keyframes slideUp {
                    from {
                        transform: translate(-50%, -48%) scale(0.9);
                        opacity: 0;
                    }
                    to {
                        transform: translate(-50%, -50%) scale(1);
                        opacity: 1;
                    }
                }
            </style>

            <!-- Modal Dialog -->
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="modal-dialog" id="modalDialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle">Confirm Delete</h3>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p id="modalMessage">Are you sure you want to delete this item? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel-modal" onclick="closeModal()">Cancel</button>
                        <button class="btn-delete-modal" onclick="confirmDelete()">Delete</button>
                    </div>
                </div>
            </div>

            <script>
                let currentForm = null;

                function showConfirmDialog(form, title, message) {
                    currentForm = form;
                    document.getElementById('modalTitle').textContent = title || 'Confirm Delete';
                    document.getElementById('modalMessage').textContent = message || 'Are you sure you want to delete this item? This action cannot be undone.';
                    document.getElementById('modalBackdrop').classList.add('active');
                    document.getElementById('modalDialog').classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeModal() {
                    document.getElementById('modalBackdrop').classList.remove('active');
                    document.getElementById('modalDialog').classList.remove('active');
                    document.body.style.overflow = '';
                    currentForm = null;
                }

                function confirmDelete() {
                    if (currentForm) {
                        currentForm.submit();
                    }
                }

                // Close modal when clicking backdrop
                document.getElementById('modalBackdrop').addEventListener('click', closeModal);

                // Close modal on Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                    }
                });
            </script>
        </div>
    </body>
</html>
