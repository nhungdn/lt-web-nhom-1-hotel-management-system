<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dang nhap - Hotel Management</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand-block">
          <p class="eyebrow">Hotel Management System</p>
          <h1>Dang nhap he thong</h1>
          <p class="subtitle">
            Su dung tai khoan duoc cap de truy cap quan ly khach san.
          </p>
        </div>

        <div class="alert success" th:if="${logoutSuccess}">
          Dang xuat thanh cong.
        </div>
        <div class="alert error" th:if="${loginError}">
          Sai ten dang nhap hoac mat khau.
        </div>

        <form class="login-form" th:action="@{/login}" method="post">
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <label for="username">Ten dang nhap</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
          />

          <label for="password">Mat khau</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Dang nhap</button>
        </form>
      </section>
    </main>
  </body>
</html>
