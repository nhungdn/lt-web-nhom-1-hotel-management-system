<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
<head>
    <title>Customer Form</title>
    <th:block th:fragment="head">
        <link rel="stylesheet" th:href="@{/css/room-card.css}" />
        <link rel="stylesheet" th:href="@{/css/form.css}" />
    </th:block>
</head>
<body>
    <h1 th:fragment="title" th:text="${customer.customerId} != null ? 'Edit Customer' : 'Create Customer'">Customer Form</h1>
    <div th:fragment="content">
        <section class="content-grid" style="grid-template-columns: 1fr;">
            <div class="glass-card table-card">
                <div class="card-header">
                    <div>
                        <h2 class="card-title" th:text="${customer.customerId} != null ? 'Edit Customer' : 'Create New Customer'">Customer Form</h2>
                        <p class="card-subtitle" th:text="${customer.customerId} != null ? 'Update the customer record' : 'Add a new customer profile'">Customer details</p>
                    </div>
                </div>
                <form th:action="${customer.customerId} != null ? '/customers/update/' + ${customer.customerId} : '/customers/create'"
                      th:object="${customer}" method="post" class="form-container">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" type="text" th:field="*{name}" class="form-input glass" placeholder="Enter customer name" required />
                    </div>
                    <div class="form-group">
                        <label for="phone" class="form-label">Phone</label>
                        <input id="phone" type="text" th:field="*{phone}" class="form-input glass" placeholder="Enter phone number" required />
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" th:field="*{email}" class="form-input glass" placeholder="Enter email address" />
                    </div>
                    <div class="form-group">
                        <label for="idCard" class="form-label">ID Card</label>
                        <input id="idCard" type="text" th:field="*{idCard}" class="form-input glass" placeholder="Enter ID card number" required />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Save</button>
                        <a th:href="@{/customers}" class="btn-cancel">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
