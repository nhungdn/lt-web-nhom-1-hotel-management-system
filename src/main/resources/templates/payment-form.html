<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}"
>
  <head>
    <title>Payment Form</title>
    <th:block th:fragment="head">
      <link rel="stylesheet" th:href="@{/css/room-card.css}" />
      <link rel="stylesheet" th:href="@{/css/payment-form.css}" />
    </th:block>
  </head>
  <body>
    <h1 th:fragment="title">Chi tiết hóa đơn</h1>
    <div th:fragment="content">
      <section class="content-grid" style="grid-template-columns: 1fr">
        <div class="glass-card table-card">
          <div class="payment-detail-view" th:if="${viewOnly}">
            <div class="payment-customer">
              <div>
                <strong>Booking:</strong>
                <span
                  th:text="${invoiceSummary != null && invoiceSummary.bookingId != null ? '#' + invoiceSummary.bookingId : 'N/A'}"
                  >#0</span
                >
              </div>
              <div>
                <strong>Khách hàng:</strong>
                <span
                  th:text="${invoiceSummary != null && invoiceSummary.customerName != null ? invoiceSummary.customerName : 'N/A'}"
                  >N/A</span
                >
              </div>
              <div>
                <strong>Số điện thoại:</strong>
                <span
                  th:text="${invoiceSummary != null && invoiceSummary.customerPhone != null ? invoiceSummary.customerPhone : 'N/A'}"
                  >N/A</span
                >
              </div>
              <div>
                <strong>Email:</strong>
                <span
                  th:text="${invoiceSummary != null && invoiceSummary.customerEmail != null ? invoiceSummary.customerEmail : 'N/A'}"
                  >N/A</span
                >
              </div>
            </div>

            <div
              class="payment-summary-grid"
              th:if="${selectedInvoice != null}"
            >
              <div class="payment-summary-item paid">
                <span>Số tiền hóa đơn</span>
                <strong
                  th:text="${#numbers.formatDecimal(selectedInvoice.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                  >0 đ</strong
                >
              </div>
            </div>

            <div class="payment-section">
              <h4>Chi tiết hóa đơn</h4>
              <div class="payment-empty" th:if="${selectedInvoice == null}">
                Không tìm thấy chi tiết cho hóa đơn này.
              </div>
              <div
                class="payment-invoice-list"
                th:if="${selectedInvoice != null}"
              >
                <div class="payment-invoice-item paid">
                  <div class="payment-invoice-head">
                    <strong
                      th:text="${'Phòng ' + (selectedInvoice.roomNumber != null ? selectedInvoice.roomNumber : 'N/A')}"
                      >Detail</strong
                    >
                    <span>Đã thanh toán</span>
                  </div>
                  <div
                    class="payment-invoice-meta"
                    th:text="${'Mã hóa đơn #' + (selectedInvoice.paymentId != null ? selectedInvoice.paymentId : 'N/A') + ' | ' + (selectedInvoice.paymentDate != null ? selectedInvoice.paymentDate : 'N/A')}"
                  >
                    Payment
                  </div>
                  <table class="payment-detail-table">
                    <thead>
                      <tr>
                        <th>Hạng mục</th>
                        <th>SL</th>
                        <th>Đơn giá</th>
                        <th>Thành tiền</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:each="line : ${selectedInvoice.chargeLines}">
                        <td th:text="${line.label}">Item</td>
                        <td
                          th:text="${line.quantity != null ? line.quantity : '-'}"
                        >
                          1
                        </td>
                        <td
                          th:text="${#numbers.formatDecimal(line.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                        >
                          0 đ
                        </td>
                        <td
                          th:text="${#numbers.formatDecimal(line.lineTotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                        >
                          0 đ
                        </td>
                      </tr>
                    </tbody>
                  </table>
                  <div
                    class="payment-invoice-total"
                    th:text="${'Số tiền đã thanh toán: ' + #numbers.formatDecimal(selectedInvoice.amount, 0, 'COMMA', 0, 'POINT') + ' đ'}"
                  >
                    Số tiền đã thanh toán: 0 đ
                  </div>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <a th:href="@{/payments}" class="card-btn">Quay lại</a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
