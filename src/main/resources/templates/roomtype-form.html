<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
    <head>
        <title>Room Type Form</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <th:block th:fragment="head">
            <link rel="stylesheet" th:href="@{/css/room-card.css}"/>
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
        </th:block>
    </head>
    
    <body>
        <h1 th:fragment="title" th:text="${roomtype.roomTypeId} != null ? 'Edit Room Type' : 'Create Room Type'">Room Type Form</h1>
        <div th:fragment="content">
            <section class="content-grid" style="grid-template-columns: 1fr;">
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title" th:text="${roomtype.roomTypeId} != null ? 'Edit Room Type' : 'Create New Room Type'">Room Type Form</h2>
                            <p class="card-subtitle" th:text="${roomtype.roomTypeId} != null ? 'Update room type details' : 'Add a new room type to the system'">Form</p>
                        </div>
                    </div>

                    <form th:action="${roomtype.roomTypeId} != null ? '/roomtypes/update/' + ${roomtype.roomTypeId} : '/roomtypes/create'" 
                          th:object="${roomtype}" method="post" class="form-container">
                        
                        <input type="hidden" th:if="${roomtype.roomTypeId} != null" th:field="*{roomTypeId}"/>
                        
                        <div class="form-section">
                            <h3 class="form-section-title">Room Type Information</h3>
                            
                            <div class="form-group">
                                <label for="name" class="form-label">Room Type Name <span style="color: #ef4444;">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-input glass" required placeholder="e.g., Standard, Deluxe, Suite"/>
                                <span class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                            </div>

                            <div class="form-group">
                                <label for="price" class="form-label">Price per Day <span style="color: #ef4444;">*</span></label>
                                <div class="input-group">
                                    <span class="input-prefix">₫</span>
                                    <input type="number" id="price" th:field="*{price}" class="form-input glass" required step="0.01" min="0" placeholder="0.00"/>
                                </div>
                                <span class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>

                            <div class="form-group">
                                <label for="description" class="form-label">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-input glass" placeholder="Enter room type description..." rows="5" style="resize: vertical;"></textarea>
                                <span class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">Save Room Type</button>
                            <a th:href="@{/roomtypes}" class="btn-cancel">Cancel</a>
                        </div>
                    </form>
                </div>
            </section>

            <style>
                .form-container {
                    max-width: 600px;
                }

                .form-section {
                    margin-bottom: 32px;
                    padding-bottom: 32px;
                    border-bottom: 1px solid var(--glass-border);
                }

                .form-section:last-of-type {
                    border-bottom: none;
                }

                .form-section-title {
                    font-size: 16px;
                    font-weight: 600;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                }

                .form-section-subtitle {
                    font-size: 13px;
                    color: var(--text-muted);
                    margin-bottom: 16px;
                }

                .form-group {
                    margin-bottom: 20px;
                }

                .form-label {
                    display: block;
                    font-size: 14px;
                    font-weight: 500;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                }

                .form-input {
                    width: 100%;
                    padding: 12px 16px;
                    font-family: inherit;
                    font-size: 14px;
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-primary);
                    transition: all 0.2s;
                    box-sizing: border-box;
                }

                .form-input:focus {
                    outline: none;
                    background: rgba(255, 255, 255, 0.1);
                    border-color: #34d399;
                    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
                }

                .form-input::placeholder {
                    color: var(--text-muted);
                }

                .form-error {
                    display: block;
                    color: #ef4444;
                    font-size: 12px;
                    margin-top: 6px;
                }

                .input-group {
                    position: relative;
                }

                .input-prefix {
                    position: absolute;
                    left: 16px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--text-muted);
                    font-weight: 600;
                }

                .input-group .form-input {
                    padding-left: 36px;
                }

                .form-actions {
                    display: flex;
                    gap: 12px;
                    margin-top: 32px;
                }

                .btn-submit {
                    flex: 1;
                    padding: 12px 24px;
                    background: linear-gradient(135deg, #34d399, #10b981);
                    color: white;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                }

                .btn-submit:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 10px 20px rgba(52, 211, 153, 0.2);
                }

                .btn-cancel {
                    flex: 1;
                    padding: 12px 24px;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-secondary);
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    text-decoration: none;
                    text-align: center;
                    font-size: 14px;
                    font-weight: 600;
                    transition: all 0.2s;
                    cursor: pointer;
                }

                .btn-cancel:hover {
                    background: rgba(255, 255, 255, 0.1);
                    border-color: var(--emerald-light);
                }
            </style>
        </div>
    </body>
</html>
