<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::dashboard_content}, ~{::dashboard_title}, ~{::dashboard_head})}">
<head>
    <title>Dashboard - Hotel Management</title>
    <th:block th:fragment="dashboard_head">
    </th:block>
</head>
<body>

    <h1 th:fragment="dashboard_title">Dashboard</h1>

    <div th:fragment="dashboard_content">
        <style>
            .dashboard-welcome {
                background: linear-gradient(135deg, rgba(52, 211, 153, 0.1), rgba(34, 197, 94, 0.1));
                border-radius: 16px;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(52, 211, 153, 0.2);
                padding: 40px;
                margin-bottom: 40px;
                text-align: center;
            }

            .dashboard-welcome h2 {
                font-size: 32px;
                font-weight: 700;
                margin-bottom: 12px;
                background: linear-gradient(135deg, #34d399, #10b981);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .dashboard-welcome p {
                font-size: 16px;
                color: var(--text-muted);
                margin-bottom: 24px;
            }

            .dashboard-stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 24px;
                margin-bottom: 40px;
            }

            .stat-card {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                padding: 24px;
                text-align: center;
            }

            .stat-icon {
                font-size: 32px;
                margin-bottom: 12px;
            }

            .stat-value {
                font-size: 24px;
                font-weight: 700;
                color: #34d399;
                margin-bottom: 8px;
            }

            .stat-label {
                font-size: 13px;
                color: var(--text-muted);
            }

            .quick-links {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
                margin-bottom: 40px;
            }

            .quick-link-btn {
                padding: 16px 20px;
                background: linear-gradient(135deg, rgba(52, 211, 153, 0.2), rgba(34, 197, 94, 0.1));
                border: 1px solid rgba(52, 211, 153, 0.3);
                border-radius: 12px;
                color: #34d399;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.3s ease;
                text-align: center;
                cursor: pointer;
            }

            .quick-link-btn:hover {
                background: linear-gradient(135deg, rgba(52, 211, 153, 0.3), rgba(34, 197, 94, 0.2));
                border-color: rgba(52, 211, 153, 0.6);
                transform: translateY(-2px);
            }

            .content-section {
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                padding: 24px;
            }

            .content-section h3 {
                margin-bottom: 20px;
                font-size: 18px;
                font-weight: 600;
                color: #f5f5f4;
            }

            @media (max-width: 768px) {
                .dashboard-welcome h2 {
                    font-size: 24px;
                }

                .dashboard-stats {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <div class="dashboard-welcome">
            <h2>Welcome to Your Dashboard</h2>
            <p th:text="|Hello, ${session.user.fullName}! You are logged in as ${session.user.role}|">Welcome message</p>
        </div>

        <div class="quick-links">
            <a th:href="@{/rooms}" class="quick-link-btn">
                📋 Rooms Management
            </a>
            <a th:href="@{/roomtypes}" class="quick-link-btn">
                🏠 Room Types Management
            </a>
            <a th:href="@{/services}" class="quick-link-btn">
                🛎️ Services Management
            </a>
            <a th:if="${session.user.role.toString() == 'ADMIN'}" th:href="@{/users}" class="quick-link-btn">
                👥 Staff Management
            </a>
        </div>
    </div>

</body>
</html>
