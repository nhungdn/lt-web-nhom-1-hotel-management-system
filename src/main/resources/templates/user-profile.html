<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}"
>
  <head>
    <title>Profile - Hotel Management</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:fragment="head">
      <link rel="stylesheet" th:href="@{/css/room-card.css}" />
      <link rel="stylesheet" th:href="@{/css/users-list.css}" />
    </th:block>
  </head>
  <body>
    <h1 th:fragment="title">Thông tin cá nhân</h1>

    <div th:fragment="content">
      <section class="content-grid users-content-grid">
        <div class="glass-card user-edit-card">
          <div
            class="alert success"
            th:if="${successMessage}"
            th:text="${successMessage}"
          ></div>
          <div
            class="alert success"
            th:if="${passwordMessage}"
            th:text="${passwordMessage}"
          ></div>

          <div class="alert error" th:if="${errorMessage}">
            <span th:if="${errorMessage == 'current_password_invalid'}"
              >Mật khẩu hiện tại không chính xác.</span
            >
            <span th:if="${errorMessage == 'password_mismatch'}"
              >Mật khẩu mới không khớp nhau.</span
            >
            <span th:if="${errorMessage == 'user_not_found'}"
              >Người dùng không tồn tại.</span
            >
          </div>

          <form
            class="user-edit-form"
            th:action="@{/profile/update}"
            method="post"
          >
            <label for="profileUsername">Tên đăng nhập</label>
            <input
              id="profileUsername"
              type="text"
              th:value="${currentUser.username}"
              readonly
            />

            <label for="profileRole">Vai trò</label>
            <input
              id="profileRole"
              type="text"
              th:value="${currentUser.role}"
              readonly
            />

            <label for="profileFullName">Họ và tên</label>
            <input
              id="profileFullName"
              type="text"
              name="fullName"
              th:value="${oldData != null ? oldData.fullName : currentUser.fullName}"
              required
            />

            <label for="profilePhone">Số điện thoại</label>
            <input
              id="profilePhone"
              type="tel"
              name="phoneNumber"
              th:value="${oldData != null ? oldData.phoneNumber : currentUser.phoneNumber}"
              required
            />

            <label for="currentPassword">Mật khẩu hiện tại (bắt buộc)</label>
            <input
              id="currentPassword"
              type="password"
              name="currentPassword"
              placeholder="Nhập mật khẩu hiện tại để xác nhận"
              required
            />

            <label for="newPassword">Mật khẩu mới (tùy chọn)</label>
            <input
              id="newPassword"
              type="password"
              name="newPassword"
              placeholder="Nhập mật khẩu mới (nếu có)"
            />

            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input
              id="confirmPassword"
              type="password"
              name="confirmPassword"
              placeholder="Xác nhận mật khẩu mới"
            />

            <div class="user-form-actions">
              <button type="submit" class="card-btn">Cập nhật thông tin</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
