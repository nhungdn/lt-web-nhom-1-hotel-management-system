<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hotel Management</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/review.png}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="../../static/css/style.css" type="text/css"/>

</head>

<body>
    <!-- Animated Background -->
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    
    <div class="parent-div">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img th:src="@{/images/hotel-icon.svg}" alt="Hotel Icon"/>
                </div>
                <span class="logo-text">Hotel Management</span>
            </div>

            <ul class="nav-menu">
                <li class="nav-section">
                    <span class="nav-section-title">Main Menu</span>
                    <ul>
                        <li class="nav-item" th:if="${user?.role == 'ADMIN'}">
                            <a href="index.html" class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" 
                                     class="nav-icon" viewBox="0 0 24 24" fill="none" 
                                     stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                                </svg>
                                Dashboard
                                <span class="nav-badge">ADMIN</span>
                            </a>
                        </li>
                        <li class="nav-item" th:if="${user?.role == 'ADMIN'}">
                            <a href="users.html" class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" 
                                     class="nav-icon" viewBox="0 0 24 24" fill="none" 
                                     stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                                Users
                                <span class="nav-badge">ADMIN</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="analytics.html" class="nav-link active">
                                <svg xmlns="http://www.w3.org/2000/svg" 
                                     class="nav-icon" viewBox="0 0 24 24" fill="none" 
                                     stroke="currentColor" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                                </svg>
                                Room Status
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a href="settings.html" class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" 
                                     class="nav-icon" viewBox="0 0 24 24" fill="none" 
                                     stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                </svg>
                                Settings
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-section">
                    <span class="nav-section-title">Account</span>
                    <ul>
                        <li class="nav-item">
                            <a href="login.html" class="nav-link">
                                <svg xmlns="http://www.w3.org/2000/svg" 
                                     class="nav-icon" viewBox="0 0 24 24" fill="none" 
                                     stroke="currentColor" stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                Logout
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">A</div>
                    <div class="user-info">
                        <div class="user-name" th:text="${user.username}">AL</div>
                        <div class="user-role" th:text="${user.role}">STAFF</div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" 
                         width="16" height="16" viewBox="0 0 24 24" 
                         fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>
        </aside>
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navbar -->
            <nav class="navbar">
                <h1 class="page-title" layout:fragment="title">Main Menu</h1>
                <div class="navbar-right">
                    <div class="search-box">
                        <svg xmlns="http://www.w3.org/2000/svg" 
                             class="search-icon" viewBox="0 0 24 24" 
                             fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search anything..."/>
                    </div>
                    
                    <button class="nav-btn"  title="Thông tin nhóm 1">
                        <svg xmlns="http://www.w3.org/2000/svg" 
                             width="24" height="24" 
                             viewBox="0 0 24 24" fill="none" 
                             stroke="#000000" stroke-width="2" 
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                    </button>
                </div>
            </nav>
            
            <div layout:fragment="content"></div>
            
        </main>
    </div>
     

    <!-- Footer -->
    <footer class="site-footer"> <p> BTL môn Lập trình Web, Nhóm 1, 2026 </p></footer>
</body>
</html>
