<!doctype html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  th:fragment="main_layout(main_content, page_title, extra_head)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Management</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/review.png}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <th:block th:replace="${extra_head} ?: ~{}"></th:block>
  </head>

  <body>
    <!-- Animated Background -->
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="parent-div">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <img th:src="@{/images/hotel-icon.svg}" alt="Hotel Icon" />
          </div>
          <span class="logo-text">Hotel Management</span>
        </div>

        <ul class="nav-menu">
          <li class="nav-section">
            <span class="nav-section-title">Main Menu</span>
            <ul>
              <li
                class="nav-item"
                th:if="${session.user != null and session.user.role.toString() == 'ADMIN'}"
              >
                <a
                  th:href="@{/dashboard}"
                  class="nav-link"
                  th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                  </svg>
                  Dashboard
                  <!-- <span class="nav-badge">ADMIN</span> -->
                </a>
              </li>
              <li
                class="nav-item"
                th:if="${session.user != null and session.user.role.toString() == 'ADMIN'}"
              >
                <a
                  th:href="@{/users}"
                  class="nav-link"
                  th:classappend="${activePage == 'users'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  </svg>
                  Staff
                  <!-- <span class="nav-badge">ADMIN</span> -->
                </a>
              </li>
              <li class="nav-item">
                <a
                  th:href="@{/booking/status}"
                  class="nav-link"
                  th:classappend="${activePage == 'bookstat'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    width="800px"
                    height="800px"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    fill="none"
                  >
                    <path
                      d="M3 18H21M12 6V4M4 15V14C4 9.58172 7.58172 
                                          6 12 6V6C16.4183 6 20 9.58172 20 14V15H4Z"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  Booking Status
                </a>
              </li>

              <li class="nav-item">
                <a
                  th:href="@{/rooms}"
                  class="nav-link"
                  th:classappend="${activePage == 'rooms'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M3 7h18M3 12h18M3 17h18" />
                  </svg>
                  Rooms
                </a>
              </li>

              <li class="nav-item">
                <a
                  th:href="@{/roomtypes}"
                  class="nav-link"
                  th:classappend="${activePage == 'roomtypes'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                  Room Types
                </a>
              </li>

              <li class="nav-item">
                <a
                  th:href="@{/services}"
                  class="nav-link"
                  th:classappend="${activePage == 'services'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M6 3h12v18H6z" />
                    <path d="M9 8h6" />
                    <path d="M9 12h6" />
                    <path d="M9 16h6" />
                  </svg>
                  Services
                </a>
              </li>

              <li class="nav-item">
                <a
                  th:href="@{/customers}"
                  class="nav-link"
                  th:classappend="${activePage == 'customers'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="800px"
                    height="800px"
                    stroke="currentColor"
                    viewBox="0 0 1024 1024"
                    fill="none"
                    class="nav-icon"
                    version="1.1"
                  >
                    <path
                      d="M749.7 548.7l-164.6 91.4V823l164.6 
                                          91.4L914.3 823V640.1l-164.6-91.4zM841.1 780l-91.4 50.8-91.4-50.8v-96.8l91.4-50.8 91.4 50.8V780z"
                      fill="currentColor"
                    />
                    <path
                      d="M713.600831 737.455926a36.6 36.6 0 1 0 72.255718-11.719698 36.6 36.6 0 1 0-72.255718 11.719698Z"
                      fill="currentColor"
                    />
                    <path
                      d="M688.7 479.8c-12.7-6.2-25.7-11.8-38.9-16.6 49.8-40.3 81.6-101.8 81.6-170.6 0-121-98.4-219.4-219.4-219.4s-219.4 98.4-219.4 219.4c0 68.9 31.9 130.5 81.7 
                                          170.7-154.2 56.4-264.6 204.5-264.6 378h73.1c0-181.5 147.7-329.1 329.1-329.1 50.7 0 99.3 11.2 144.5 33.3l32.3-65.7zM512 
                                          146.3c80.7 0 146.3 65.6 146.3 146.3S592.7 438.9 512 438.9s-146.3-65.6-146.3-146.3S431.4 146.3 512 146.3z"
                      fill="currentColor"
                    />
                  </svg>
                  Customer
                </a>
              </li>
              <li class="nav-item">
                <a
                  th:href="@{/payments}"
                  class="nav-link"
                  th:classappend="${activePage == 'payments'} ? ' active' : ''"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="nav-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M21 10V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3" />
                    <path d="M3 10h18" />
                    <path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10" />
                    <path d="M8 14h8" />
                    <path d="M8 18h5" />
                  </svg>
                  Payments
                </a>
              </li>
            </ul>
          </li>
        </ul>

        <div class="sidebar-footer">
          <a
            class="user-profile"
            id="userProfileTrigger"
            th:href="@{/profile}"
            aria-label="Open profile page"
          >
            <div
              class="user-avatar"
              th:text="${session.user != null and !#strings.isEmpty(session.user.username)} ? ${#strings.substring(session.user.username, 0, 1).toUpperCase()} : 'U'"
            >
              A
            </div>
            <div class="user-info">
              <div class="user-name" th:text="${session.user?.username}">
                AL
              </div>
              <div class="user-role" th:text="${session.user?.role}">STAFF</div>
            </div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </a>
          <div class="logout">
            <a th:href="@{/logout}" class="nav-link">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Logout
            </a>
          </div>
        </div>
      </aside>
      <!-- Main Content -->
      <main class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar">
          <h1 class="page-title" th:replace="${page_title}">Main Menu</h1>
          <div class="navbar-right">
            <div class="search-box">
              <!-- <svg
                xmlns="http://www.w3.org/2000/svg"
                class="search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                class="search-input"
                placeholder="Search anything..."
              />
            </div> -->

            <!-- <button class="nav-btn" title="Thông tin nhóm 1">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            </button> -->
          </div>
        </nav>

        <div th:replace="${main_content}"></div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <p>BTL môn Lập trình Web, <a rel="nofollow">Nhóm 1</a>, 2026</p>
    </footer>
    <script>
        const homeBtn = document.querySelector(".sidebar-header");
        homeBtn.addEventListener("click", () => {
            window.location.href = "/";
        });
        </script>
  </body>
</html>
