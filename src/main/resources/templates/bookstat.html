<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: main_layout(
          main_content=~{::content},
          page_title=~{::title},
          extra_head=~{::head},
          global_popup=~{::popups})}">

    <head>
        <title>Booking Status</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        <th:block th:fragment="head">
            <meta name="_csrf" th:content="${_csrf.token}"/>
            <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

            <link rel="stylesheet" th:href="@{/css/room-card.css}" />
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
            <link rel="stylesheet" th:href="@{/css/detail-popup.css}"/>

            <script src="https://code.jquery.com/jquery-1.11.3.min.js" defer></script>
            <script th:src="@{/js/booking-list.js}" defer></script>
            <script th:src="@{/js/booking-select.js}" defer></script>
            <script th:src="@{/js/booking.js}" defer></script>
        </th:block>
    </head>

    <body>
        <h1 th:fragment="title">Booking Status</h1>
        <div th:fragment="content">
            <section class="content-grid">
                <!-- Data Table -->
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title" th:text="${'Booking Status - Tháng ' + selectedMonth + '/' + selectedYear}">Recent change</h2>
                            <br/>
                            <a class="card-btn" href="/">+ New booking</a>
                        </div>
                        <div class="card-actions" style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                            <form
                                th:action="@{/booking/status}"
                                method="get"
                                style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end"
                            >
                                <select
                                    name="month"
                                    class="card-search-input"
                                    style="min-width: 120px"
                                    placeholder="-- Chọn tháng --"
                                >
                                    <option
                                        th:each="m : ${#numbers.sequence(1,12)}"
                                        th:value="${m}"
                                        th:selected="${m == selectedMonth}"
                                        th:text="${'Tháng ' + m}"
                                    >
                                        Tháng
                                    </option>
                                </select>

                                <select
                                    name="year"
                                    class="card-search-input"
                                    style="min-width: 120px"
                                    placeholder="-- Chọn năm --"
                                >
                                    <option
                                        th:each="y : ${#numbers.sequence(currentYear - 5, currentYear + 1)}"
                                        th:value="${y}"
                                        th:selected="${y == selectedYear}"
                                        th:text="${y}"
                                    >
                                        Năm
                                    </option>
                                </select>

                                <button type="submit" class="card-btn">Lọc</button>
                            </form>

                            <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;">
                                <input type="text" id="roomSearchInput" class="card-search-input" placeholder="Search room number (e.g. 101)" />
                            </div>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table" id="roomTable">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer Name</th>
                                    <th>Contact Info</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template id="booking-template">
                                    <tr>
                                        <td class="bid"></td>
                                        <td>
                                            <div class="customer">
                                                <span class="name"></span>
                                                <span class="id-card"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="contact">
                                                <span class="phone"></span>
                                                <span class="email"></span>
                                            </div>
                                        </td>
                                        <td><span class="status-badge"></span></td>

                                        <td>
                                            <button type="button" class="card-btn details-btn" style="padding: 6px 12px;">Details</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <template id="detail-template">
                            <td colspan='5'>
                                <div class="detail-container">
                                    <h4>Chi tiết đặt phòng</h4>
                                    <table class="detail-table">
                                    <thead>
                                    <tr>
                                        <th>Detail ID</th>
                                        <th>Status</th>
                                        <th>Room Number</th>
                                        <th>Check-In</th>
                                        <th>Check-out</th>
                                        <th>Action</th>
                                    </tr>
                                    </thead>
                                    <tbody class="detail-body"></tbody>
                                    </table>
                                </div>
                            </tr>
                        </template>

                    </div>
                </div>
            </section>
            <script th:inline="javascript">
                const bookingData = /*[[${bookingList}]]*/ [];

                document.addEventListener('DOMContentLoaded', () => {
                    console.log(bookingData);
                    renderBookingList(bookingData);
                    initRoomSearch(bookingData);
                    loadAllServices();
                });
                let allServices = [];

                async function loadAllServices() {
                    try {
                        const response = await fetch('/services/api/all', {
                            method: 'GET',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        allServices = await response.json();
                    } catch (error) {
                        console.error("Không thể load danh sách dịch vụ:", error);
                    }
                }
            </script>
        </div>
        <!-- start popup group -->
        <div th:fragment="popups">
            <div class="popup-overlay" id="popupOverlay">
                <div class="glass popup">
                    <form id="edit-form">
                        <div class="roomNumber"></div>
                        <div class="status-group">
                            <label for="status-select">Status:</label>
                            <select id="status-select" class="status-badge">
                                <option value="PENDING">PENDING</option>
                                <option value="CHECKED_IN">CHECKED_IN</option>
                                <option value="COMPLETED">COMPLETED</option>
                                <option value="CANCELED">CANCELED</option>
                            </select>
                        </div>
                        <div class="checkIn"></div>
                        <div class="checkOut"></div>
                        <div class="customer">
                            <span class="name"></span>
                            <span class="id-card"></span>
                            <span class="phone"></span>
                            <span class="email"></span>
                        </div>
                        <div class="service-container">
                            <button>Edit Service</button>
                            <div class="service">Add</div>
                            <template>
                                <div class="service">
                                    <label>
                                        <div class="name"></div> :
                                        <input name='service-quantity' class="quantity"></input>
                                    </label>
                                    <div class="price"></div>
                                    <div class="addedAt"></div>
                                </div>
                            </template>
                        </div>
                        <div class="form-actions">
                            <button type="submit">Save</button>
                            <button type="reset">Reset</button>
                        </div>
                        <button class="cancel">Cancel Booking This Room</button>
                    </form>
                </div>
            </div>
            <!-- start payment popup -->
            <div class="popup-overlay" id="paymentPopupOverlay">
                <div class="glass popup payment-popup">
                    <div class="payment-popup-header">
                        <h3>Hóa đơn booking <span id="paymentBookingCode">#</span></h3>
                        <button type="button" class="payment-close-btn" id="paymentPopupClose">Đóng</button>
                    </div>
                    <div class="payment-customer" id="paymentCustomerInfo"></div>

                    <div class="payment-summary-grid">
                        <div class="payment-summary-item paid">
                            <span>Đã thanh toán</span>
                            <strong id="paidTotalAmount">0 đ</strong>
                        </div>
                        <div class="payment-summary-item unpaid">
                            <span>Chưa thanh toán</span>
                            <strong id="unpaidTotalAmount">0 đ</strong>
                        </div>
                    </div>

                    <div class="payment-section">
                        <h4>Hóa đơn đã thanh toán</h4>
                        <div id="paidInvoiceList" class="payment-invoice-list"></div>
                    </div>

                    <div class="payment-section">
                        <h4>Hóa đơn chưa thanh toán</h4>
                        <div id="unpaidInvoiceList" class="payment-invoice-list"></div>
                    </div>

                    <div class="payment-actions">
                        <button type="button" class="card-btn" id="confirmPayBtn">Thanh toán & xuất hóa đơn</button>
                    </div>
                </div>
            </div>
            <!-- end payment popup -->
        </div>
        <!-- end popup-->
    </body>
</html>
