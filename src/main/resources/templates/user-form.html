<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinh sua nguoi dung - Hotel Management</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card signup-card">
        <div class="brand-block">
          <p class="eyebrow">Hotel Management System</p>
          <h1>Chinh sua nguoi dung</h1>
          <p class="subtitle">Cap nhat thong tin tai khoan trong he thong.</p>
        </div>

        <form
          class="login-form"
          th:action="@{/users/update/{id}(id=${user.userId})}"
          method="post"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <label for="username">Ten dang nhap</label>
          <input id="username" type="text" th:value="${user.username}" disabled />

          <label for="fullName">Ho va ten</label>
          <input id="fullName" name="fullName" type="text" th:value="${user.fullName}" required />

          <label for="phoneNumber">So dien thoai</label>
          <input
            id="phoneNumber"
            name="phoneNumber"
            type="tel"
            th:value="${user.phoneNumber}"
            required
          />

          <label for="role">Vai tro</label>
          <select id="role" name="role" required>
            <option value="STAFF" th:selected="${user.role != null and user.role.name() == 'STAFF'}">STAFF</option>
            <option value="RECEPTIONIST" th:selected="${user.role != null and user.role.name() == 'RECEPTIONIST'}">RECEPTIONIST</option>
            <option value="ADMIN" th:selected="${user.role != null and user.role.name() == 'ADMIN'}">ADMIN</option>
          </select>

          <button type="submit">Cap nhat</button>
        </form>

        <p class="auth-switch">
          Quay ve danh sach nguoi dung
          <a th:href="@{/users}">Tai day</a>
        </p>
      </section>
    </main>
  </body>
</html>
