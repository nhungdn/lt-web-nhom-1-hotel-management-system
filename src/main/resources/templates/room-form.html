<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
    <head>
        <title>Room Form</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <th:block th:fragment="head">
            <link rel="stylesheet" th:href="@{/css/room-card.css}"/>
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
        </th:block>
    </head>
    
    <body>
        <h1 th:fragment="title" th:text="${room.roomId} != null ? 'Edit Room' : 'Create Room'">Room Form</h1>
        <div th:fragment="content">
            <section class="content-grid" style="grid-template-columns: 1fr;">
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title" th:text="${room.roomId} != null ? 'Edit Room' : 'Create New Room'">Room Form</h2>
                            <p class="card-subtitle" th:text="${room.roomId} != null ? 'Update room details' : 'Add a new room to the system'">Form</p>
                        </div>
                    </div>

                    <form th:action="${room.roomId} != null ? '/rooms/update/' + ${room.roomId} : '/rooms/create'" 
                          th:object="${room}" method="post" class="form-container">
                        
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:if="${room.roomId} != null" th:field="*{roomId}"/>
                        
                        <div class="form-section">
                            <h3 class="form-section-title">Basic Information</h3>
                            
                            <div class="form-group">
                                <label for="roomNumber" class="form-label">Room Number <span style="color: #ef4444;">*</span></label>
                                <input type="text" id="roomNumber" th:field="*{roomNumber}" class="form-input glass" placeholder="e.g., 101, 202"/>
                                <span class="form-error" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></span>
                            </div>

                            <div class="form-group">
                                <label for="roomTypeId" class="form-label">Room Type <span style="color: #ef4444;">*</span></label>
                                <select id="roomTypeId" th:field="*{roomTypeId}" class="form-input glass">
                                    <option value="">-- Select Room Type --</option>
                                    <option th:each="rt : ${roomTypes}" th:value="${rt.roomTypeId}" th:text="${#numbers.formatDecimal(rt.price, 0, 'COMMA', 0, 'POINT') + ' đ'+ '/day'}"></option>
                                </select>
                                <span class="form-error" th:if="${#fields.hasErrors('roomTypeId')}" th:errors="*{roomTypeId}"></span>
                            </div>

                            <div class="form-group">
                                <label for="status" class="form-label">Status <span style="color: #ef4444;">*</span></label>
                                <select id="status" th:field="*{status}" class="form-input glass">
                                    <option value="">-- Select Status --</option>
                                    <option value="AVAILABLE">Available</option>
                                    <option value="BOOKED">Booked</option>
                                    <option value="OCCUPIED">Occupied</option>
                                    <option value="CLEANING">Cleaning</option>
                                </select>
                                <span class="form-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                            </div>
                        </div>

                        <!-- New Room Info Section -->
                        <div class="form-section" th:if="${room.roomId} == null">
                            <h3 class="form-section-title">Room Images</h3>
                            <p class="form-section-subtitle">Add images while creating the room (optional)</p>
                            
                            <div id="imagesContainer">
                                <div class="image-input-group" style="margin-bottom: 16px;">
                                    <div class="form-group">
                                        <label class="form-label">Image URL</label>
                                        <input type="url" class="form-input glass" name="images[0].imageUrl" placeholder="https://example.com/image.jpg"/>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Image Description</label>
                                        <input type="text" class="form-input glass" name="images[0].description" placeholder="e.g., Bedroom view"/>
                                    </div>
                                </div>
                            </div>

                            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                                <button type="button" class="card-btn" onclick="addImageField()" style="padding: 8px 16px; font-size: 13px;">+ Add More Images</button>
                                <button type="button" class="card-btn" style="padding: 8px 16px; font-size: 13px; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.3);" onclick="clearAllImages()">Clear All</button>
                            </div>
                        </div>

                        <!-- Room Images Section -->
                        <div class="form-section" th:if="${room.roomId} != null">
                            <h3 class="form-section-title">Room Images</h3>
                            <p class="form-section-subtitle">Manage images for this room</p>
                            
                            <div class="images-container">
                                <div class="image-placeholder" th:if="${#lists.isEmpty(roomImages)}">
                                    <p>No images uploaded yet</p>
                                </div>
                                
                                <div class="images-grid" th:unless="${#lists.isEmpty(roomImages)}">
                                    <div class="image-item" th:each="img : ${roomImages}">
                                        <img th:src="${img.imageUrl}" alt="Room image" class="image-preview"/>
                                        <p class="image-desc" th:text="${img.description != null ? img.description : 'No description'}"></p>
                                        <div class="image-actions">
                                            <a th:href="@{/roomimages/edit/{id}(id=${img.roomImageId}, returnUrl=${'/rooms/' + room.roomId + '/edit'})}" class="btn-sm btn-edit">Edit</a>
                                            <button type="button" class="btn-sm btn-danger" th:data-delete-url="@{/roomimages/delete/{id}(id=${img.roomImageId}, returnUrl=${'/rooms/' + room.roomId + '/edit'})}" onclick="deleteImageViaDataAttr(this)">Delete</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <a th:href="@{/rooms/{id}/images/add(id=${room.roomId})}" class="card-btn">+ Add New Image</a>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">Save Room</button>
                            <a th:href="@{/rooms}" class="btn-cancel">Cancel</a>
                        </div>
                    </form>
                </div>
            </section>

            <style>
                .form-container {
                    max-width: 800px;
                }

                .form-section {
                    margin-bottom: 32px;
                    padding-bottom: 32px;
                    border-bottom: 1px solid var(--glass-border);
                }

                .form-section:last-of-type {
                    border-bottom: none;
                }

                .form-section-title {
                    font-size: 16px;
                    font-weight: 600;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                }

                .form-section-subtitle {
                    font-size: 13px;
                    color: var(--text-muted);
                    margin-bottom: 16px;
                }

                .form-group {
                    margin-bottom: 20px;
                }

                .form-label {
                    display: block;
                    font-size: 14px;
                    font-weight: 500;
                    margin-bottom: 8px;
                    color: var(--text-primary);
                }

                .form-input {
                    width: 100%;
                    padding: 12px 16px;
                    font-family: inherit;
                    font-size: 14px;
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.05);
                    color: #fff; /* var(--text-primary) */
                    transition: all 0.2s;
                }

                .form-input:focus {
                    outline: none;
                    background: rgba(255, 255, 255, 0.1);
                    border-color: #34d399;
                    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
                }

                select.form-input {
                    color: #ffffff; /* chữ trong ô select */
                }

                select.form-input option {
                    background-color: #1f2937; /* nền dropdown */
                    color: #ffffff;           /* chữ dropdown */
}

                .form-error {
                    display: block;
                    color: #ef4444;
                    font-size: 12px;
                    margin-top: 6px;
                }

                .images-container {
                    background: rgba(0, 0, 0, 0.2);
                    border-radius: 8px;
                    padding: 20px;
                    margin-bottom: 16px;
                }

                .image-placeholder {
                    text-align: center;
                    padding: 40px 20px;
                    color: var(--text-muted);
                }

                .images-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                    gap: 16px;
                    margin-bottom: 16px;
                }

                .image-item {
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    overflow: hidden;
                    background: rgba(0, 0, 0, 0.3);
                }

                .image-preview {
                    width: 100%;
                    height: 120px;
                    object-fit: cover;
                }

                .image-desc {
                    padding: 8px;
                    font-size: 12px;
                    color: var(--text-muted);
                    border-bottom: 1px solid var(--glass-border);
                }

                .image-actions {
                    padding: 8px;
                    display: flex;
                    gap: 4px;
                }

                .btn-sm {
                    padding: 4px 8px;
                    font-size: 11px;
                }

                .btn-primary {
                    display: inline-block;
                    padding: 10px 16px;
                    background-color: #34d399;
                    color: white;
                    text-decoration: none;
                    border-radius: 6px;
                    font-size: 13px;
                    font-weight: 500;
                    transition: background-color 0.2s;
                }

                .btn-primary:hover {
                    background-color: #10b981;
                }

                .btn-danger {
                    background-color: rgba(239, 68, 68, 0.1);
                    color: #ef4444;
                    border: 1px solid rgba(239, 68, 68, 0.3);
                    padding: 6px 12px;
                    border-radius: 6px;
                    cursor: pointer;
                    font-size: 12px;
                    transition: all 0.2s;
                }

                .btn-danger:hover {
                    background-color: rgba(239, 68, 68, 0.2);
                    border-color: rgba(239, 68, 68, 0.7);
                }

                .btn-edit {
                    background-color: rgba(52, 211, 153, 0.1);
                    color: #34d399;
                    border: 1px solid rgba(52, 211, 153, 0.3);
                    padding: 6px 12px;
                    border-radius: 6px;
                    cursor: pointer;
                    font-size: 12px;
                    text-decoration: none;
                    display: inline-block;
                    transition: all 0.2s;
                }

                .btn-edit:hover {
                    background-color: rgba(52, 211, 153, 0.2);
                    border-color: rgba(52, 211, 153, 0.6);
                }

                .btn-danger:hover {
                    background-color: rgba(239, 68, 68, 0.2);
                    border-color: rgba(239, 68, 68, 0.7);
                }

                .form-actions {
                    display: flex;
                    gap: 12px;
                    margin-top: 32px;
                }

                .btn-submit {
                    flex: 1;
                    padding: 12px 24px;
                    background: linear-gradient(135deg, #34d399, #10b981);
                    color: white;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                }

                .btn-submit:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 10px 20px rgba(52, 211, 153, 0.2);
                }

                .btn-cancel {
                    flex: 1;
                    padding: 12px 24px;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-secondary);
                    border: 1px solid var(--glass-border);
                    border-radius: 8px;
                    text-decoration: none;
                    text-align: center;
                    font-size: 14px;
                    font-weight: 600;
                    transition: all 0.2s;
                    cursor: pointer;
                }

                .btn-cancel:hover {
                    background: rgba(255, 255, 255, 0.1);
                    border-color: var(--emerald-light);
                }

                /* Modal Styles */
                .modal-backdrop {
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.4);
                    backdrop-filter: blur(5px);
                    z-index: 9998;
                    pointer-events: none;
                }

                .modal-backdrop.active {
                    display: block;
                    pointer-events: auto;
                }

                .modal-dialog {
                    display: none;
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%) scale(0.9);
                    z-index: 9999;
                    width: 100%;
                    max-width: 400px;
                }

                .modal-dialog.active {
                    display: block;
                    animation: slideUp 0.3s ease;
                }

                .modal-content {
                    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    border-radius: 20px;
                    padding: 28px;
                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                                inset 0 1px 0 rgba(255, 255, 255, 0.2);
                }

                .modal-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 16px;
                }

                .modal-header h3 {
                    font-size: 18px;
                    font-weight: 600;
                    color: #f5f5f4;
                    margin: 0;
                }

                .modal-close {
                    background: rgba(255, 255, 255, 0.1);
                    border: none;
                    color: #f5f5f4;
                    font-size: 24px;
                    width: 32px;
                    height: 32px;
                    border-radius: 8px;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                .modal-close:hover {
                    background: rgba(255, 255, 255, 0.2);
                    transform: rotate(90deg);
                }

                .modal-body {
                    margin-bottom: 20px;
                    font-size: 14px;
                    color: rgba(245, 245, 244, 0.8);
                    line-height: 1.5;
                }

                .modal-body p {
                    margin: 0;
                }

                .modal-footer {
                    display: flex;
                    gap: 12px;
                    justify-content: flex-end;
                }

                .btn-cancel, .btn-delete {
                    padding: 10px 20px;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                }

                .btn-cancel {
                    background: rgba(0, 0, 0, 0.2);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    color: #f5f5f4;
                }

                .btn-cancel:hover {
                    background: rgba(0, 0, 0, 0.3);
                    border-color: rgba(255, 255, 255, 0.2);
                }

                .btn-delete {
                    background: linear-gradient(135deg, rgba(220, 38, 38, 0.3) 0%, rgba(239, 68, 68, 0.2) 100%);
                    border: 1px solid rgba(220, 38, 38, 0.5);
                    color: #fca5a5;
                }

                .btn-delete:hover {
                    background: linear-gradient(135deg, rgba(220, 38, 38, 0.4) 0%, rgba(239, 68, 68, 0.3) 100%);
                    border-color: rgba(220, 38, 38, 0.7);
                    transform: translateY(-2px);
                }

                @keyframes slideUp {
                    from {
                        transform: translate(-50%, -48%) scale(0.9);
                        opacity: 0;
                    }
                    to {
                        transform: translate(-50%, -50%) scale(1);
                        opacity: 1;
                    }
                }
            </style>

            <!-- Modal Dialog -->
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="modal-dialog" id="modalDialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle">Confirm Delete</h3>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p id="modalMessage">Are you sure you want to delete this item? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                        <button class="btn-delete" onclick="confirmDelete()">Delete</button>
                    </div>
                </div>
            </div>

            <script>
                let currentForm = null;
                let deleteUrl = null;

                function showConfirmDialog(form, title, message, url) {
                    currentForm = form;
                    deleteUrl = url;
                    document.getElementById('modalTitle').textContent = title || 'Confirm Delete';
                    document.getElementById('modalMessage').textContent = message || 'Are you sure you want to delete this item? This action cannot be undone.';
                    document.getElementById('modalBackdrop').classList.add('active');
                    document.getElementById('modalDialog').classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeModal() {
                    document.getElementById('modalBackdrop').classList.remove('active');
                    document.getElementById('modalDialog').classList.remove('active');
                    document.body.style.overflow = '';
                    currentForm = null;
                    deleteUrl = null;
                }

                function confirmDelete() {
                    if (deleteUrl) {
                        // Create a temporary form to submit delete
                        const form = document.createElement('form');
                        form.method = 'post';
                        form.action = deleteUrl;
                        
                        // Add CSRF token
                        const csrfInput = document.createElement('input');
                        csrfInput.type = 'hidden';
                        csrfInput.name = '_csrf';
                        const csrfValue = document.querySelector('input[name="_csrf"]')?.value || '';
                        csrfInput.value = csrfValue;
                        form.appendChild(csrfInput);
                        
                        document.body.appendChild(form);
                        form.submit();
                        document.body.removeChild(form);
                    } else if (currentForm) {
                        currentForm.submit();
                    }
                }

                // Close modal when clicking backdrop
                document.getElementById('modalBackdrop').addEventListener('click', closeModal);

                // Close modal on Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                    }
                });

                // Image field management functions
                let imageFieldCount = 1;

                function addImageField() {
                    const container = document.getElementById('imagesContainer');
                    const index = imageFieldCount;
                    // Create input name dynamically without Thymeleaf processing
                    const imageUrlName = 'images[' + index + '].imageUrl';
                    const descName = 'images[' + index + '].description';
                    const fieldHtml = '<div class="image-input-group" id="imageGroup' + index + '" style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">' +
                        '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
                        '<label class="form-label" style="margin-bottom: 0;">Image ' + (index + 1) + '</label>' +
                        '<button type="button" class="btn-sm btn-danger" onclick="removeImageField(' + index + ')" style="padding: 4px 8px; font-size: 11px;">Remove</button>' +
                        '</div>' +
                        '<div class="form-group" style="margin-bottom: 8px;">' +
                        '<input type="url" class="form-input glass" name="' + imageUrlName + '" placeholder="https://example.com/image.jpg"/>' +
                        '</div>' +
                        '<div class="form-group">' +
                        '<input type="text" class="form-input glass" name="' + descName + '" placeholder="Image description (e.g., Bedroom view)"/>' +
                        '</div>' +
                        '</div>';
                    container.insertAdjacentHTML('beforeend', fieldHtml);
                    imageFieldCount++;
                }

                function removeImageField(index) {
                    const group = document.getElementById('imageGroup' + index);
                    if (group) {
                        group.remove();
                    }
                }

                function clearAllImages() {
                    const container = document.getElementById('imagesContainer');
                    const groups = container.querySelectorAll('[id^="imageGroup"]');
                    groups.forEach(group => {
                        if (group.id !== undefined && group.id !== '') {
                            group.remove();
                        }
                    });
                    
                    // Reset the first default field
                    const resetHtml = '<div class="image-input-group" style="margin-bottom: 16px;">' +
                        '<div class="form-group">' +
                        '<label class="form-label">Image URL</label>' +
                        '<input type="url" class="form-input glass" name="images[0].imageUrl" placeholder="https://example.com/image.jpg"/>' +
                        '</div>' +
                        '<div class="form-group">' +
                        '<label class="form-label">Image Description</label>' +
                        '<input type="text" class="form-input glass" name="images[0].description" placeholder="e.g., Bedroom view"/>' +
                        '</div>' +
                        '</div>';
                    container.innerHTML = resetHtml;
                    imageFieldCount = 1;
                }

                // Function to delete image via hidden form
                function deleteImage(btn, deleteUrl) {
                    showConfirmDialog(null, 'Delete Image', 'Are you sure you want to delete this image?', deleteUrl);
                }

                // Function to delete image via data attribute
                function deleteImageViaDataAttr(btn) {
                    const deleteUrl = btn.getAttribute('data-delete-url');
                    showConfirmDialog(null, 'Delete Image', 'Are you sure you want to delete this image?', deleteUrl);
                }
            </script>
        </div>
    </body>
</html>
