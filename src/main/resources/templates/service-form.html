<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Create/Update Service</title></head>
<body>
<h1>Service Form</h1>
<form th:action="@{${service.serviceId} != null ? '/services/update/' + ${service.serviceId} : '/services/create'}" th:object="${service}" method="post">
    <input type="hidden" th:if="${service.serviceId} != null" th:field="*{serviceId}"/>
    <p>Name: <input type="text" th:field="*{name}"/></p>
    <p>Price: <input type="number" step="0.01" th:field="*{price}"/></p>
    <p><button type="submit">Save</button></p>
</form>
<a th:href="@{/services}">Back to services</a>
</body>
</html>
