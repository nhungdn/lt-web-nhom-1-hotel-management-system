<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
    <head>
        <title>Room Types</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <th:block th:fragment="head">
            <link rel="stylesheet" th:href="@{/css/room-card.css}" />
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
        </th:block>
    </head>
    
    <body>
        <h1 th:fragment="title">Room Types</h1>
        <div th:fragment="content">
            <section class="content-grid" style="grid-template-columns: 1fr;">
                <!-- Data Table -->
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Room Types Management</h2>
                            <p class="card-subtitle">Manage room types and their pricing</p>
                        </div>
                        <div class="card-actions">
                            <a th:href="@{/roomtypes/create}" class="card-btn">+ Create New Room Type</a>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table" id="roomTypesTable">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Price/Day</th>
                                    <th>Description</th>
                                    <th>Rooms</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="roomtype : ${roomtypes}">
                                    <td>
                                        <strong th:text="${roomtype.name}"></strong>
                                    </td>
                                    <td>
                                        <span class="price-badge" th:text="${#numbers.formatDecimal(roomtype.price, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
                                    </td>
                                    <td>
                                        <span class="text-muted" th:text="${roomtype.description != null ? roomtype.description : 'N/A'}"></span>
                                    </td>
                                    <td>
                                        <span class="rooms-count" th:text="${roomtype.totalRooms != null ? roomtype.totalRooms : 0}"></span>
                                    </td>
                                    <td>
                                        <div class="action-buttons">
                                            <a th:href="@{/roomtypes/edit/{id}(id=${roomtype.roomTypeId})}" class="card-btn" style="padding: 6px 12px;">Edit</a>
                                            <form th:action="@{/roomtypes/delete/{id}(id=${roomtype.roomTypeId})}" method="post" style="display:inline;" class="delete-form">
                                                <button type="button" class="card-btn btn-danger" style="padding: 6px 12px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.5);" onclick="showConfirmDialog(this.form, 'Delete Room Type', 'Are you sure you want to delete ' + this.closest('tr').querySelector('strong').textContent + '?')">Delete</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(roomtypes)}">
                                    <td colspan="5" style="text-align: center; padding: 40px;">
                                        <p>No room types found. <a th:href="@{/roomtypes/create}">Create one now</a></p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <style>
                .price-badge {
                    display: inline-block;
                    padding: 6px 12px;
                    background-color: rgba(34, 197, 94, 0.1);
                    color: #22c55e;
                    border: 1px solid rgba(34, 197, 94, 0.3);
                    border-radius: 20px;
                    font-size: 13px;
                    font-weight: 600;
                }

                .rooms-count {
                    display: inline-block;
                    padding: 6px 12px;
                    background-color: rgba(59, 130, 246, 0.1);
                    color: #3b82f6;
                    border: 1px solid rgba(59, 130, 246, 0.3);
                    border-radius: 20px;
                    font-size: 13px;
                    font-weight: 600;
                }

                .text-muted {
                    color: var(--text-muted);
                    font-size: 13px;
                }

                .action-buttons {
                    display: flex;
                    gap: 8px;
                }

                .btn-danger:hover {
                    background-color: rgba(239, 68, 68, 0.2) !important;
                    border-color: rgba(239, 68, 68, 0.7) !important;
                }

                .data-table {
                    width: 100%;
                    border-collapse: collapse;
                }

                .data-table thead th {
                    padding: 16px;
                    text-align: left;
                    font-weight: 600;
                    font-size: 13px;
                    text-transform: uppercase;
                    color: var(--text-secondary);
                    border-bottom: 2px solid var(--glass-border);
                }

                .data-table tbody td {
                    padding: 16px;
                    border-bottom: 1px solid var(--glass-border);
                    font-size: 14px;
                }

                .data-table tbody tr:hover {
                    background-color: rgba(255, 255, 255, 0.05);
                }

                .table-wrapper {
                    overflow-x: auto;
                }

                /* Modal Styles */
                .modal-backdrop {
                    display: none;
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.4);
                    backdrop-filter: blur(5px);
                    z-index: 9998;
                }

                .modal-backdrop.active {
                    display: block;
                }

                .modal-dialog {
                    display: none;
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%) scale(0.9);
                    z-index: 9999;
                    width: 100%;
                    max-width: 400px;
                }

                .modal-dialog.active {
                    display: block;
                    animation: slideUp 0.3s ease;
                }

                .modal-content {
                    background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    border-radius: 20px;
                    padding: 28px;
                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                                inset 0 1px 0 rgba(255, 255, 255, 0.2);
                }

                .modal-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 16px;
                }

                .modal-header h3 {
                    font-size: 18px;
                    font-weight: 600;
                    color: #f5f5f4;
                    margin: 0;
                }

                .modal-close {
                    background: rgba(255, 255, 255, 0.1);
                    border: none;
                    color: #f5f5f4;
                    font-size: 24px;
                    width: 32px;
                    height: 32px;
                    border-radius: 8px;
                    cursor: pointer;
                    transition: all 0.3s ease;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                .modal-close:hover {
                    background: rgba(255, 255, 255, 0.2);
                    transform: rotate(90deg);
                }

                .modal-body {
                    margin-bottom: 20px;
                    font-size: 14px;
                    color: rgba(245, 245, 244, 0.8);
                    line-height: 1.5;
                }

                .modal-body p {
                    margin: 0;
                }

                .modal-footer {
                    display: flex;
                    gap: 12px;
                    justify-content: flex-end;
                }

                .btn-cancel, .btn-delete {
                    padding: 10px 20px;
                    border: none;
                    border-radius: 8px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                }

                .btn-cancel {
                    background: rgba(0, 0, 0, 0.2);
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    color: #f5f5f4;
                }

                .btn-cancel:hover {
                    background: rgba(0, 0, 0, 0.3);
                    border-color: rgba(255, 255, 255, 0.2);
                }

                .btn-delete {
                    background: linear-gradient(135deg, rgba(220, 38, 38, 0.3) 0%, rgba(239, 68, 68, 0.2) 100%);
                    border: 1px solid rgba(220, 38, 38, 0.5);
                    color: #fca5a5;
                }

                .btn-delete:hover {
                    background: linear-gradient(135deg, rgba(220, 38, 38, 0.4) 0%, rgba(239, 68, 68, 0.3) 100%);
                    border-color: rgba(220, 38, 38, 0.7);
                    transform: translateY(-2px);
                }

                @keyframes slideUp {
                    from {
                        transform: translate(-50%, -48%) scale(0.9);
                        opacity: 0;
                    }
                    to {
                        transform: translate(-50%, -50%) scale(1);
                        opacity: 1;
                    }
                }
            </style>

            <!-- Modal Dialog -->
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="modal-dialog" id="modalDialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle">Confirm Delete</h3>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p id="modalMessage">Are you sure you want to delete this item? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                        <button class="btn-delete" onclick="confirmDelete()">Delete</button>
                    </div>
                </div>
            </div>

            <script>
                let currentForm = null;

                function showConfirmDialog(form, title, message) {
                    currentForm = form;
                    document.getElementById('modalTitle').textContent = title;
                    document.getElementById('modalMessage').textContent = message;
                    document.getElementById('modalBackdrop').classList.add('active');
                    document.getElementById('modalDialog').classList.add('active');
                    document.body.style.overflow = 'hidden';
                }

                function closeModal() {
                    document.getElementById('modalBackdrop').classList.remove('active');
                    document.getElementById('modalDialog').classList.remove('active');
                    document.body.style.overflow = '';
                    currentForm = null;
                }

                function confirmDelete() {
                    if (currentForm) {
                        currentForm.submit();
                    }
                }

                // Close modal when clicking backdrop
                document.getElementById('modalBackdrop').addEventListener('click', closeModal);

                // Close modal on Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeModal();
                    }
                });
            </script>
        </div>
    </body>
</html>
