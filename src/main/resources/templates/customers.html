<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
<head>
    <title>Customers</title>
    <th:block th:fragment="head">
        <link rel="stylesheet" th:href="@{/css/room-card.css}" />
        <link rel="stylesheet" th:href="@{/css/form.css}" />
    </th:block>
</head>
<body>
    <h1 th:fragment="title">Customer Management</h1>
    <div th:fragment="content">
        <section class="content-grid" style="grid-template-columns: 1fr;">
            <div class="glass-card table-card">
                <div class="card-header">
                    <div>
                        <h2 class="card-title">Customers</h2>
                        <p class="card-subtitle">Manage customer profiles and booking contact details</p>
                    </div>
                    <div class="card-actions">
                        <a th:href="@{/customers/create}" class="card-btn">+ Create New Customer</a>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>ID Card</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="customer : ${customers}">
                                <td th:text="${customer.name}">Name</td>
                                <td th:text="${customer.phone}">Phone</td>
                                <td th:text="${customer.email}">Email</td>
                                <td th:text="${customer.idCard}">ID Card</td>
                                <td>
                                    <div class="action-buttons">
                                        <a th:href="@{/customers/edit/{id}(id=${customer.customerId})}" class="card-btn" style="padding: 6px 12px;">Edit</a>
                                        <form th:action="@{/customers/delete/{id}(id=${customer.customerId})}" method="post" style="display:inline;">
                                            <button type="submit" class="card-btn btn-danger" style="padding: 6px 12px; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.5);" onclick="return confirm('Delete this customer?')">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(customers)}">
                                <td colspan="5" class="empty-state">No customers found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
