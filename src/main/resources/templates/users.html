<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}"
>
  <head>
    <title>Users - Hotel Management</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:fragment="head">
      <link rel="stylesheet" th:href="@{/css/room-card.css}" />
      <link rel="stylesheet" th:href="@{/css/users-list.css}" />
    </th:block>
  </head>
  <body>
    <h1 th:fragment="title">Staff</h1>

    <div th:fragment="content">
      <section
        class="content-grid users-content-grid"
        th:classappend="${editingUser != null} ? ' is-editing' : ''"
      >
        <!-- Data Table -->
        <div class="glass-card table-card users-table-card">
          <div class="card-header">
            <div>
              <h2 class="summary-number" th:text="${#lists.size(users)}">0</h2>
              <p class="summary-label">Total users in the system</p>
            </div>
            <div class="card-actions">
              <a th:href="@{/signup}" class="card-btn"> Add new user </a>
              <a th:href="@{/users}" class="card-btn">Refresh list</a>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table" id="usersTable" th:users-list="${users}">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Full name</th>
                  <th>Phone</th>
                  <th>Role</th>
                  <th th:if="${session.user?.role.toString() == 'ADMIN'}">
                    Action
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                  <td colspan="5">
                    <div class="empty-state">No users found.</div>
                  </td>
                </tr>
                <tr th:each="user : ${users}">
                  <td>
                    <div class="user-name-cell">
                      <span class="primary" th:text="${user.username}"
                        >admin</span
                      >
                      <span class="secondary" th:text="|ID: ${user.userId}|"
                        >ID: 1</span
                      >
                    </div>
                  </td>
                  <td th:text="${user.fullName}">Admin User</td>
                  <td th:text="${user.phoneNumber}">0123456789</td>
                  <td>
                    <span
                      class="role-pill"
                      th:classappend="${user.role != null ? ' ' + user.role.name().toLowerCase() : ''}"
                      th:text="${user.role}"
                      >ADMIN</span
                    >
                  </td>
                  <td th:if="${session.user?.role.toString() == 'ADMIN'}">
                    <div class="row-actions">
                      <form th:action="@{/users}" method="get">
                        <input type="hidden" name="editId" th:value="${user.userId}" />
                        <button type="submit" class="card-btn" style="padding: 6px 12px">
                          Edit
                        </button>
                      </form>
                      <form
                        th:action="@{/users/delete/{id}(id=${user.userId})}"
                        method="post"
                        onsubmit="
                          return confirm(
                            'Are you sure you want to delete this user?',
                          );
                        "
                      >
                        <input
                          type="hidden"
                          th:name="${_csrf.parameterName}"
                          th:value="${_csrf.token}"
                        />
                        <button
                          type="submit"
                          class="card-btn-delete"
                          style="padding: 6px 12px"
                        >
                          Delete
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div
          id="edit-panel"
          class="glass-card user-edit-card"
          th:if="${session.user?.role.toString() == 'ADMIN' and editingUser != null}"
        >
          <div class="card-header">
            <div>
              <h3 class="card-title">Edit User</h3>
              <p class="card-subtitle">Update selected user information</p>
            </div>
          </div>

          <div class="alert success" th:if="${updated}">
            Updated successfully.
          </div>

          <form
            class="user-edit-form"
            th:action="@{/users/update/{id}(id=${editingUser.userId})}"
            method="post"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />

            <label for="editUsername">Username</label>
            <input
              id="editUsername"
              type="text"
              th:value="${editingUser.username}"
              readonly
            />

            <label for="editFullName">Full name</label>
            <input
              id="editFullName"
              type="text"
              name="fullName"
              th:value="${editingUser.fullName}"
              required
            />

            <label for="editPhone">Phone number</label>
            <input
              id="editPhone"
              type="tel"
              name="phoneNumber"
              th:value="${editingUser.phoneNumber}"
              required
            />

            <label for="editRole">Role</label>
            <select id="editRole" name="role" required>
              <option
                th:each="itemRole : ${roles}"
                th:value="${itemRole}"
                th:text="${itemRole}"
                th:selected="${itemRole == editingUser.role}"
              ></option>
            </select>

            <div class="user-form-actions">
              <button type="submit" class="card-btn">Cap nhat</button>
              <a th:href="@{/users}" class="card-btn">Cancel</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
