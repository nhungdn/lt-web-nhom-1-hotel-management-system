<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}"
>
  <head>
    <title>Quản lý nhân viên</title>
    <th:block th:fragment="head">
      <link rel="stylesheet" th:href="@{/css/room-card.css}" />
      <link rel="stylesheet" th:href="@{/css/users-list.css}" />
    </th:block>
  </head>
  <body>
    <h1 th:fragment="title">Danh sách nhân viên</h1>

    <div th:fragment="content">
      <section
        class="content-grid users-content-grid"
        th:classappend="${editingUser != null or addingUser} ? ' is-editing'"
      >
        <div class="glass-card table-card users-table-card">
          <div class="card-header">
            <div>
              <h2 class="summary-number" th:text="${#lists.size(users)}">0</h2>
              <p class="summary-label">nhân viên</p>
            </div>
            <div class="card-actions">
              <a th:href="@{/users(add=true)}" class="card-btn">Thêm mới</a>
              <a th:href="@{/users}" class="card-btn">Tải lại</a>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Tên đăng nhập / ID</th>
                  <th>Họ và tên</th>
                  <th>Số điện thoại</th>
                  <th>Vai trò</th>
                  <th th:if="${session.user?.role.name() == 'ADMIN'}">
                    Thao tác
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                  <td colspan="5" class="empty-state">
                    Không có nhân viên nào.
                  </td>
                </tr>
                <tr th:each="user : ${users}">
                  <td>
                    <div class="user-name-cell">
                      <span class="primary" th:text="${user.username}"
                        >admin</span
                      >
                      <span class="secondary" th:text="'ID: ' + ${user.userId}"
                        >ID: 1</span
                      >
                    </div>
                  </td>
                  <td th:text="${user.fullName}">Admin User</td>
                  <td th:text="${user.phoneNumber}">0123456789</td>
                  <td>
                    <span
                      class="role-pill"
                      th:classappend="${user.role?.name()?.toLowerCase()}"
                      th:text="${user.role}"
                      >ADMIN</span
                    >
                  </td>
                  <td th:if="${session.user?.role.name() == 'ADMIN'}">
                    <div class="row-actions">
                      <a
                        th:href="@{/users(editId=${user.userId})}"
                        class="card-btn"
                        >Sửa</a
                      >

                      <form
                        th:action="@{/users/delete/{id}(id=${user.userId})}"
                        method="post"
                        onsubmit="
                          return confirm('Bạn có chắc muốn xóa tài khoản này?');
                        "
                      >
                        <button type="submit" class="card-btn-delete">
                          Xóa
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div
          id="edit-panel"
          class="glass-card user-edit-card"
          th:if="${editingUser != null}"
        >
          <h3 class="card-title">Chỉnh sửa tài khoản</h3>

          <div class="alert success" th:if="${updated}">
            Cập nhật thành công.
          </div>
          <div class="alert success" th:if="${passwordReset}">
            Đã đặt lại mật khẩu.
          </div>

          <form
            class="user-edit-form"
            th:action="@{/users/update/{id}(id=${editingUser.userId})}"
            method="post"
          >
            <label>Tên đăng nhập</label>
            <input
              type="text"
              th:value="${editingUser.username}"
              readonly
              class="readonly-input"
            />

            <label>Họ và tên</label>
            <input
              type="text"
              name="fullName"
              th:value="${editingUser.fullName}"
              required
            />

            <label>Số điện thoại</label>
            <input
              type="tel"
              name="phoneNumber"
              th:value="${editingUser.phoneNumber}"
              required
            />

            <label>Vai trò</label>
            <select name="role">
              <option
                th:each="r : ${roles}"
                th:value="${r}"
                th:text="${r}"
                th:selected="${r == editingUser.role}"
              ></option>
            </select>

            <div class="user-form-actions">
              <button type="submit" class="card-btn">Lưu</button>

              <button
                type="submit"
                class="card-btn reset-btn"
                th:formaction="@{/users/reset-password/{id}(id=${editingUser.userId})}"
                formmethod="post"
                onclick="return confirm('Đặt lại mật khẩu về mặc định?');"
              >
                Reset mật khẩu
              </button>

              <a th:href="@{/users}" class="card-btn">Đóng</a>
            </div>
          </form>
        </div>

        <div
          id="add-panel"
          class="glass-card user-edit-card"
          th:if="${addingUser}"
        >
          <h3 class="card-title">Tạo tài khoản mới</h3>

          <div class="alert success" th:if="${created}">Tạo thành công.</div>
          <div
            class="alert error"
            th:if="${createError}"
            th:text="${createError}"
          ></div>

          <form
            class="user-edit-form"
            th:action="@{/users/create}"
            method="post"
          >
            <label>Tên đăng nhập</label>
            <input
              type="text"
              name="username"
              th:value="${signupRequest.username}"
              required
            />

            <label>Họ và tên</label>
            <input
              type="text"
              name="fullname"
              th:value="${signupRequest.fullname}"
              required
            />

            <label>Số điện thoại</label>
            <input
              type="tel"
              name="phoneNumber"
              th:value="${signupRequest.phoneNumber}"
              required
            />

            <label>Vai trò</label>
            <select name="role">
              <option
                th:each="r : ${roles}"
                th:value="${r}"
                th:text="${r}"
                th:selected="${signupRequest.role == r.name()}"
              ></option>
            </select>

            <div class="user-form-actions">
              <button type="submit" class="card-btn">Tạo</button>
              <a th:href="@{/users}" class="card-btn">Hủy</a>
            </div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
