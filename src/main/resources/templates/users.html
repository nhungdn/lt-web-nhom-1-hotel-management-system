<!doctype html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}"
>
  <head>
    <title>Users - Hotel Management</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:fragment="head">
      <link rel="stylesheet" th:href="@{/css/users-list.css}" />
      <link rel="stylesheet" th:href="@{/css/room-card.css}" />
    </th:block>
  </head>
  <body>
    <h1 th:fragment="title">Staff</h1>

    <div th:fragment="content">
      <section class="content-grid">
        <!-- Data Table -->
        <div class="glass-card table-card">
          <div class="card-header">
            <div>
              <h2 class="summary-number" th:text="${#lists.size(users)}">0</h2>
              <p class="summary-label">Total users in the system</p>
            </div>
            <div class="card-actions">
              <a th:href="@{/signup}" class="card-btn"> Add new user </a>
              <a th:href="@{/users}" class="card-btn">Refresh list</a>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table" id="usersTable" th:users-list="${users}">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Full name</th>
                  <th>Phone</th>
                  <th>Role</th>
                  <th th:if="${session.user?.role.toString() == 'ADMIN'}">
                    Action
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                  <td colspan="5">
                    <div class="empty-state">No users found.</div>
                  </td>
                </tr>
                <tr th:each="user : ${users}">
                  <td>
                    <div class="user-name-cell">
                      <span class="primary" th:text="${user.username}"
                        >admin</span
                      >
                      <span class="secondary" th:text="|ID: ${user.userId}|"
                        >ID: 1</span
                      >
                    </div>
                  </td>
                  <td th:text="${user.fullName}">Admin User</td>
                  <td th:text="${user.phoneNumber}">0123456789</td>
                  <td>
                    <span
                      class="role-pill"
                      th:classappend="${user.role != null ? ' ' + user.role.name().toLowerCase() : ''}"
                      th:text="${user.role}"
                      >ADMIN</span
                    >
                  </td>
                  <td th:if="${session.user?.role.toString() == 'ADMIN'}">
                    <button class="card-btn" style="padding: 6px 12px">
                      Edit
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
