<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ulraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
    <head>
        <title>Room Status</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" th:href="@{/css/room-card.css}" />
        <link rel="stylesheet" th:href="@{/css/calendar.css}"/>
    </head>
    
    <body>
        <h1 layout:fragment="title">Room Status</h1>
        <div layout:fragment="content">
            <section class="content-grid">
                <!-- Data Table -->
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Recent change</h2>
                            <p class="card-subtitle">Latest booking and cleaning status</p>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn">View All</button>
                            <button class="card-btn booking-btn">New Booking</button>
                        </div>
                    </div>
                    <div class="booking-div">
                            <input type="date" id="start"/>
                            <input type="date" id="end"/>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table" id="roomTable" th:rooms-list="${roomList}">
                            <thead>
                                <tr>
                                    <th>Room Type</th>
                                    <th>Room ID</th>
                                    <th>Status</th>
                                    <th>Check-in Date</th>
                                    <th>Check-out Date</th>
                                    <th>Book</th>
                                    <th th:if="${session.user?.role.toString() == 'ADMIN'}">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template id="tr-template">
                                    <tr>
                                        <td>
                                            <div class="table-room">
                                                <span class="table-room-name"></span>
                                                <span class="table-room-desc"></span>
                                            </div>
                                        </td>
                                        <td class="room-id"></td>
                                        <td><span class="status-badge"></span></td>
                                        <td class="checkin"></td>
                                        <td class="checkout"></td>
                                        <td><input type="checkbox"/></td>
                                        <td th:if="${session.user?.role.toString() == 'ADMIN'}">
                                            <button class="card-btn" style="padding: 6px 12px;">Edit</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <div class="form-overlay"> <div th:replace="~{fragments/bookingform}"></div></div>
            <script th:src="@{/js/booking.js}"></script>
            <script th:src="@{/js/roomlist.js}"></script>
        </div>
    </body>
</html>
