<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: main_layout(~{::content}, ~{::title}, ~{::head})}">
    <head>
        <title>Room Status</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <th:block th:fragment="head">
            <link rel="stylesheet" th:href="@{/css/room-card.css}" />
            <link rel="stylesheet" th:href="@{/css/calendar.css}"/>
            <link rel="stylesheet" th:href="@{/css/form.css}"/>
        </th:block>
    </head>
    
    <body>
        <h1 th:fragment="title">Room Status</h1>
        <div th:fragment="content">
            <section class="content-grid">
                <!-- Data Table -->
                <div class="glass-card table-card">
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">Recent change</h2>
                            <p class="card-subtitle">Latest booking and cleaning status</p>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn">View All</button>
                            <button class="card-btn booking-btn">New Booking</button>
                        </div>
                    </div>
                    <div class="booking-div booktab hidden">
                        <div>
                            <input type="date" id="start"/>
                            <input type="date" id="end"/>
                        </div>

                        <svg fill="#000000" width="800px" height="800px" 
                             viewBox="0 0 24 24" data-name="Line Color" 
                             xmlns="http://www.w3.org/2000/svg" class="booking-guest">
                            <path id="secondary" d="M17,17h4m-2-2v4" 
                                  style="fill: none; stroke: rgb(44, 169, 188);
                                stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">      
                            </path>
                            <path id="primary" d="M14,13.29A6.91,6.91,0,0,0,12,13H10a7,7,0,0,0-7,7,1,1,0,0,0,1,1H15" 
                                  style="fill: none; stroke: rgb(0, 0, 0);
                                  stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;"></path>
                            <circle id="primary-2" data-name="primary" cx="11" cy="8" r="5" 
                                    style="fill: none; stroke: rgb(0, 0, 0); stroke-linecap: round;
                                stroke-linejoin: round; stroke-width: 2;">
                            </circle>
                        </svg>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table" id="roomTable" th:rooms-list="${roomList}">
                            <thead>
                                <tr>
                                    <th>Room Type</th>
                                    <th>Room ID</th>
                                    <th>Status</th>
                                    
                                    <th class="roomtab">Check-in Date</th>
                                    <th class="roomtab">Check-out Date</th>
                                    
                                    <th class="hidden booktab">Price/Day</th>
                                    <th class="hidden booktab" style="text-align: center;">Book</th>
                                    
                                    <th th:if="${session.user?.role.toString() == 'ADMIN'}" class="roomtab">Action</th>
                                    <th th:if="${session.user?.role.toString() == 'ADMIN'}" class="hidden booktab">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template id="tr-template">
                                    <tr>
                                        <td>
                                            <div class="table-room">
                                                <span class="table-room-name"></span>
                                                <span class="table-room-desc"></span>
                                            </div>
                                        </td>
                                        <td class="room-id"></td>
                                        <td><span class="status-badge"></span></td>
                                        
                                        <td class="roomtab checkin"></td>
                                        <td class="roomtab checkout"></td>
                                        
                                        <td class="hidden booktab price"></td>
                                        <td class="hidden booktab" style="justify-content: center;text-align: center;">
                                            <input type="checkbox" name="book-checkbox"/>
                                        </td>
                                        
                                        <td th:if="${session.user?.role.toString() == 'ADMIN'}" class="roomtab">
                                            <button class="card-btn" style="padding: 6px 12px;">Edit</button>
                                        </td>
                                        <td th:if="${session.user?.role.toString() == 'ADMIN'}" class="hidden booktab">
                                            <button class="card-btn" style="padding: 6px 12px;">Edit Book</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <div class="form-overlay"> <div th:replace="~{fragments/bookingform}"></div></div>
            <script th:src="@{/js/booking.js}"></script>

            <script th:src="@{/js/roomlist.js}"></script>
        </div>
    </body>
</html>
